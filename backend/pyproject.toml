[project]
name = "nurlanrahimli-portfolio-backend"
version = "0.1.0"
description = "Backend API for Nurlan Rahimli's portfolio"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
